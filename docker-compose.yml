name: legaldocs

# The keys below are anvil's well-known development accounts. Never reuse them.
x-chain: &chain
  ETH_RPC_URL: http://anvil:8545
  REGISTRY_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"

x-parent: &parent
  image: legaldocs-parent
  build:
    context: .
    dockerfile: parent/Dockerfile
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-parent-env: &parent-env
  <<: *chain
  DATABASE_URL: postgresql+psycopg://legaldocs:legaldocs@postgres:5432/legaldocs
  REDIS_URL: redis://redis:6379/0
  ENCLAVE_HOST: enclave
  ENCLAVE_PORT: "8443"
  PARENT_CERT: /run/secrets/parent_cert
  PARENT_KEY: /run/secrets/parent_key
  NSM_TRUST_ANCHOR: /trust/nsm-root.pem
  EXPECTED_PCR0: ${EXPECTED_PCR0:-}

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: legaldocs
      POSTGRES_USER: legaldocs
      POSTGRES_PASSWORD: legaldocs
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legaldocs -d legaldocs"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.5@sha256:32c8ea9ef052a440cb1620175987a3f49eff8b068a0c6a3d09ebf7f5f9a0e043
    command: ["anvil --host 0.0.0.0 --chain-id 31337 --silent"]
    ports: ["127.0.0.1:${ANVIL_PORT:-8545}:8545"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      retries: 30

  nsm:
    build:
      context: .
      dockerfile: nsm/Dockerfile
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - nsm-socket:/run/nsm
      - nsm-trust:/trust
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/nsm/nsm.sock && test -f /trust/nsm-root.pem"]
      interval: 1s
      retries: 30

  enclave:
    build:
      context: .
      dockerfile: enclave/Dockerfile
    networks: [vsock]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - nsm-socket:/run/nsm
    configs:
      - source: parent_ca
        target: /etc/legaldocs/parent-ca.crt
    environment:
      PARENT_CA: /etc/legaldocs/parent-ca.crt
    depends_on:
      nsm: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from enclave.server import healthcheck; healthcheck()"]
      interval: 1s
      retries: 30

  migrate:
    <<: *parent
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://legaldocs:legaldocs@postgres:5432/legaldocs
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}

  deploy:
    <<: *parent
    command: ["python", "-m", "parent.chain", "deploy"]
    environment:
      <<: *chain
      OWNER_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      RELAYER_ADDRESS: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
    networks: [backend]
    depends_on:
      anvil: {condition: service_healthy}

  api:
    <<: *parent
    command: ["uvicorn", "--factory", "parent.api:app_from_env", "--host", "0.0.0.0", "--port", "8000"]
    environment: *parent-env
    secrets: [parent_cert, parent_key]
    volumes:
      - nsm-trust:/trust:ro
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    networks: [backend, vsock]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      enclave: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      retries: 30

  worker:
    <<: *parent
    command: ["celery", "--app", "parent.worker", "worker", "--concurrency", "2", "--loglevel", "INFO"]
    environment:
      <<: *parent-env
      RELAYER_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
    secrets: [parent_cert, parent_key]
    volumes:
      - nsm-trust:/trust:ro
    networks: [backend, vsock]
    depends_on:
      migrate: {condition: service_completed_successfully}
      deploy: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      enclave: {condition: service_healthy}

networks:
  backend: {}
  vsock:
    internal: true

volumes:
  nsm-socket: {}
  nsm-trust: {}

secrets:
  parent_cert:
    file: ./certs/parent.crt
  parent_key:
    file: ./certs/parent.key

configs:
  parent_ca:
    file: ./certs/parent-ca.crt
